name: Generate Shadowrocket Rules

on:
  schedule:
    - cron: '0 20 * * *' # 每天 UTC 20:00 运行
  workflow_dispatch:      # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    # 赋予 GITHUB_TOKEN 写入权限，以便推送到其他分支
    permissions:
      contents: write 

    steps:
    - name: Checkout source code (main branch)
      uses: actions/checkout@v4
      with:
        ref: main  # 明确检出 main 分支，因为脚本在这里

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyYAML

    - name: Run conversion script
      run: python convert.py

    # 以下是跨分支推送的核心逻辑
    - name: Push to shadowrocket branch
      run: |
        # 配置 Git 用户信息
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        
        # 进入生成的规则目录
        cd rules
        
        # 初始化一个新的临时 Git 仓库
        git init
        git add .
        git commit -m "Update rules at $(date '+%Y-%m-%d %H:%M:%S')"
        
        # 强制推送到 shadowrocket 分支
        # 使用 GITHUB_TOKEN 进行认证
        # 注意：这会覆盖 shadowrocket 分支的历史，使其始终保持为最新的规则快照
        git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" master:shadowrocket
